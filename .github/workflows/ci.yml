name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  core-test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=packages/core
      - run: npm run test --workspace=packages/core

  agency-test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: core-test
    strategy:
      fail-fast: false
      matrix:
        package:
          - arbetsmiljo
          - boverket
          - msb
          - folkhalsomyndigheten
          - stralsakerhet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build core
        run: npm run build --workspace=packages/core
      - name: Typecheck
        run: npm run typecheck --workspace=packages/${{ matrix.package }}
      - name: Test
        run: npm run test --workspace=packages/${{ matrix.package }}
