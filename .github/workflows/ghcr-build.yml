name: GHCR Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: arbetsmiljo
            image: swedish-work-environment-mcp
          - package: boverket
            image: swedish-building-code-mcp
          - package: msb
            image: swedish-emergency-preparedness-mcp
          - package: folkhalsomyndigheten
            image: swedish-public-health-mcp
          - package: stralsakerhet
            image: swedish-radiation-protection-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build core
        run: npm run build -w packages/core
      - name: Run ingestion
        run: npx -w packages/${{ matrix.package }} tsx src/ingest.ts --force
        timeout-minutes: 10

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          push: true
          tags: |
            ghcr.io/ansvar-systems/${{ matrix.image }}:latest
            ghcr.io/ansvar-systems/${{ matrix.image }}:sha-${{ github.sha }}
